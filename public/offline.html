<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Farm Monitor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #111827;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 24px; color: #15803d; }
    p { color: #6b7280; font-size: 16px; max-width: 300px; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #15803d;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="icon">🌿</div>
  <h1>You are offline</h1>
  <p>The Farm Monitor app needs an internet connection to load this page. Please try again when you're back online.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
